name: Publish Public Site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static files
        run: |
          mkdir -p dist
          cp index.html dist/
          cp styles.css dist/
          cp script.js dist/
          cp schedule.json dist/
          if [ -f CNAME ]; then cp CNAME dist/; fi

      - name: Push to public site repository
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.PUBLIC_SITE_DEPLOY_KEY }}
          external_repository: darw1sh/legacy-events-timer-site
          publish_branch: gh-pages
          publish_dir: ./dist
          force_orphan: true